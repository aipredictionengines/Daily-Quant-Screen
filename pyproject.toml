[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-quant-screen"
version = "0.1.0"
description = "Paper-only daily multi-asset quant forecasting screen; BUILD-001 starts with BTC."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dqs = "dqs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dqs*"]
