name: DQS BTC Candidate

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Candidate lifecycle action"
        required: true
        type: choice
        options:
          - lock
          - resolve
        default: lock
      market_date:
        description: "YYYY-MM-DD; leave blank to use current Europe/Sofia date"
        required: false
        type: string
  schedule:
    # 06:30 Sofia during EEST / 05:30 during EET — always inside the 05:00–08:00 gate.
    - cron: "30 3 * * 5"
    # Safely after 12:00 ET resolution across DST mismatch periods.
    - cron: "10 17 * * 5"

permissions:
  contents: write

concurrency:
  group: dqs-btc-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve action and market date
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "30 3 * * 5" ]; then
              ACTION="lock"
            else
              ACTION="resolve"
            fi
            D="$(TZ=Europe/Sofia date +%F)"
          else
            ACTION="${{ inputs.action }}"
            if [ -n "${{ inputs.market_date }}" ]; then
              D="${{ inputs.market_date }}"
            else
              D="$(TZ=Europe/Sofia date +%F)"
            fi
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "Action: $ACTION"
          echo "Market date: $D"

      - name: Stop scheduled candidate after gate passes
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("qa/candidate-gate.json")
          data = json.loads(p.read_text()) if p.exists() else {}
          ready = data.get("state") == "READY_FOR_PAPER" and data.get("passed") is True
          print(f"candidate_gate_ready_for_paper={ready}")
          with open("$GITHUB_OUTPUT", "a", encoding="utf-8") as fh:
              fh.write(f"already_passed={'true' if ready else 'false'}\n")
          PY

      - name: Candidate readiness gate
        if: steps.meta.outputs.action == 'lock' && steps.gate.outputs.already_passed != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from dqs.qa import readiness_report
          r = readiness_report(Path("."))
          print(r)
          if not r.get("candidate_ready"):
              raise SystemExit("Candidate gate is not ready")
          PY

      - name: Protocol eligibility
        if: steps.meta.outputs.action == 'lock' && steps.gate.outputs.already_passed != 'true'
        shell: bash
        run: |
          D="${{ steps.meta.outputs.date }}"
          if [ "$(TZ=Europe/Sofia date -d "$D" +%u)" = "4" ]; then
            echo "Thursday is excluded by protocol."
            exit 2
          fi
          python - <<PY
          from datetime import date
          from pathlib import Path
          from dqs.calendar import is_official_fomc_meeting_day
          d = date.fromisoformat("$D")
          is_fomc, status = is_official_fomc_meeting_day(d, Path("config/fomc-2026.json"))
          print({"fomc_status": status, "official_meeting_day": is_fomc})
          if status != "PASS" or is_fomc:
              raise SystemExit("Candidate date is not eligible under the FOMC gate")
          PY

      - name: Refuse duplicate candidate lock
        id: duplicate
        if: steps.meta.outputs.action == 'lock' && steps.gate.outputs.already_passed != 'true'
        shell: bash
        run: |
          D="${{ steps.meta.outputs.date }}"
          if [ -f "artifacts/candidates/$D/BTC/forecast.json" ]; then
            echo "Candidate forecast already exists for $D; keeping immutable artifact."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: LIVE-DATA health before candidate lock
        if: steps.meta.outputs.action == 'lock' && steps.gate.outputs.already_passed != 'true' && steps.duplicate.outputs.exists != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          D="${{ steps.meta.outputs.date }}"
          mkdir -p "artifacts/candidates/$D/BTC"
          python -m dqs.health --root . --date "$D" --output "artifacts/candidates/$D/BTC/health.json"

      - name: Lock non-counting candidate
        if: steps.meta.outputs.action == 'lock' && steps.gate.outputs.already_passed != 'true' && steps.duplicate.outputs.exists != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          D="${{ steps.meta.outputs.date }}"
          python -m dqs.cli --root . morning --date "$D" --mode candidate
          python -m dqs.cli --root . render --date "$D" --mode candidate

      - name: Persist immutable candidate lock
        if: steps.meta.outputs.action == 'lock' && steps.gate.outputs.already_passed != 'true' && steps.duplicate.outputs.exists != 'true'
        shell: bash
        run: |
          D="${{ steps.meta.outputs.date }}"
          git config user.name "DQS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "artifacts/candidates/$D/BTC"
          git commit -m "candidate: lock DQS-BTC-CANDIDATE-001 for $D"
          git push origin HEAD:main

      - name: Refresh main before resolution
        if: steps.meta.outputs.action == 'resolve' && steps.gate.outputs.already_passed != 'true'
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Candidate existence gate
        id: candidate
        if: steps.meta.outputs.action == 'resolve' && steps.gate.outputs.already_passed != 'true'
        shell: bash
        run: |
          D="${{ steps.meta.outputs.date }}"
          if [ -f "artifacts/candidates/$D/BTC/forecast.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No locked candidate exists for $D; resolution skipped."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve non-counting candidate
        if: steps.meta.outputs.action == 'resolve' && steps.gate.outputs.already_passed != 'true' && steps.candidate.outputs.exists == 'true'
        run: |
          D="${{ steps.meta.outputs.date }}"
          if [ ! -f "artifacts/candidates/$D/BTC/score.json" ]; then
            python -m dqs.cli --root . resolve --date "$D" --mode candidate
          fi
          python -m dqs.cli --root . render --date "$D" --mode candidate

      - name: Review candidate lifecycle
        if: steps.meta.outputs.action == 'resolve' && steps.gate.outputs.already_passed != 'true' && steps.candidate.outputs.exists == 'true'
        run: |
          D="${{ steps.meta.outputs.date }}"
          python -m dqs.review --root . --date "$D" --output qa/candidate-gate.json
          python -m dqs.cli --root . readiness

      - name: Persist candidate resolution and review
        if: steps.meta.outputs.action == 'resolve' && steps.gate.outputs.already_passed != 'true' && steps.candidate.outputs.exists == 'true'
        shell: bash
        run: |
          D="${{ steps.meta.outputs.date }}"
          git config user.name "DQS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add "artifacts/candidates/$D/BTC" qa/candidate-gate.json
          git commit -m "candidate: review DQS-BTC-CANDIDATE-001 for $D"
          git push origin HEAD:main

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ steps.meta.outputs.action }}-${{ steps.meta.outputs.date }}
          path: |
            artifacts/candidates/${{ steps.meta.outputs.date }}/BTC/
            qa/candidate-gate.json
          if-no-files-found: warn
          retention-days: 90
